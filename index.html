<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burrow</title>
    <meta name="description" content="Burrow: a small browser game played in nine holes." />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      The name is a name, not a tutorial: the brief allows naming the game and
      forbids telling anyone how to play it. Nothing in this document, the
      README, or any label may say what to do -- the opening screen has to make
      the first move obvious on its own.

      The <nav> landmark is vestigial on a one-page game, but spec/invariants
      reads the built, unexecuted HTML and a JS-injected landmark is invisible
      to it (C4 proved that the hard way). So it is real markup, kept to a
      screen-reader-only home link rather than faked or dropped.
    -->
    <header class="chrome">
      <h1 class="wordmark">Burrow</h1>
      <nav aria-label="Primary"><a class="sr-only" href="./">Burrow</a></nav>
    </header>

    <main>
      <div class="lives" id="lives" role="img" aria-label="Lives remaining">
        <span class="pip"></span><span class="pip"></span><span class="pip"></span
        ><span class="pip"></span><span class="pip"></span>
      </div>

      <div class="field" id="field">
        <button class="hole" type="button" data-hole="0" aria-label="Hole 1"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="1" aria-label="Hole 2"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="2" aria-label="Hole 3"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="3" aria-label="Hole 4"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="4" aria-label="Hole 5"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="5" aria-label="Hole 6"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="6" aria-label="Hole 7"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="7" aria-label="Hole 8"><span class="target"></span><span class="mark"></span></button>
        <button class="hole" type="button" data-hole="8" aria-label="Hole 9"><span class="target"></span><span class="mark"></span></button>
      </div>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
